name: Reviewer1 v1.3 Stage 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reviewer1-v13-stage1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reviewer1-v13-tests-20260820
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke test at 5000 tx/s
        run: |
          python scripts/run_campaign.py --rates 5000 --schedulers adaptive fixed adaptive_batch --trials 3 --transactions 5000 --warmup 500 --out data/raw/stage1_smoke_5000.csv
      - name: Fixed-window sweep
        run: |
          python scripts/sweep.py --fixed-window --trials 5 --transactions 20000 --warmup 2000 --out data/processed/stage1
      - name: Latency-target sweep
        run: |
          python scripts/sweep.py --l-target --trials 5 --transactions 20000 --warmup 2000 --out data/processed/stage1
      - name: Gain sensitivity
        run: |
          python scripts/sweep.py --gains --trials 5 --transactions 20000 --warmup 2000 --out data/processed/stage1
      - name: Saturation sweep
        run: |
          python scripts/run_campaign.py --sweep-saturation --transactions 20000 --warmup 2000
          mv data/raw/saturation_sweep.csv data/raw/stage1_saturation_sweep.csv
      - name: Bursty smoke - MMPP
        run: |
          python scripts/run_campaign.py --rates 500 1500 3000 --schedulers adaptive fixed adaptive_batch --trials 3 --workload mmpp --transactions 10000 --warmup 1000 --out data/raw/stage1_mmpp.csv
      - name: Bursty smoke - on/off
        run: |
          python scripts/run_campaign.py --rates 500 1500 3000 --schedulers adaptive fixed adaptive_batch --trials 3 --workload onoff --transactions 10000 --warmup 1000 --out data/raw/stage1_onoff.csv
      - name: Commit stage-1 results to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/stage1_*.csv data/processed/stage1/*.csv
          git commit -m "Add Reviewer 1 v1.3 stage-1 simulation results" || exit 0
          git push origin HEAD:reviewer1-v13-tests-20260820
