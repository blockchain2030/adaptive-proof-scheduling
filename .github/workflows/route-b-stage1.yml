name: Route B recalibration

on:
  pull_request:
    branches: [main]

jobs:
  recalibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile src/route_b_scheduler.py scripts/route_b_recalibrate.py src/pipeline_route_b.py
      - name: Feedback-ready latency-target sweep
        run: |
          python scripts/route_b_recalibrate.py target-sweep \
            --trials 5 --transactions 20000 --warmup 2000 --trial-offset 10 \
            --out data/route_b/recal_target_sweep.csv
      - name: Controller target and Kp calibration grid
        run: |
          python scripts/route_b_recalibrate.py controller-grid \
            --trials 5 --transactions 20000 --warmup 2000 --trial-offset 20 \
            --out data/route_b/recal_controller_grid.csv
      - name: Corrected gain sensitivity at target 220 ms
        run: |
          python scripts/route_b_recalibrate.py gain-sensitivity \
            --trials 5 --transactions 20000 --warmup 2000 --trial-offset 30 \
            --l-target 220 --kp 0.8 \
            --out data/route_b/recal_gain_sensitivity_220.csv
      - name: Upload recalibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: route-b-recalibration
          path: data/route_b/
          if-no-files-found: error
