name: Route B calibration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tabulate
      - name: Syntax check
        run: |
          python -m py_compile src/pipeline_route_b.py scripts/route_b_experiment.py scripts/route_b_summarize.py
      - name: Smoke test
        run: |
          python scripts/route_b_experiment.py smoke \
            --trials 3 --transactions 10000 --warmup 1000 --l-target 240 \
            --out data/route_b/stage1_smoke.csv
      - name: Fixed-window sweep
        run: |
          python scripts/route_b_experiment.py window-sweep \
            --trials 5 --transactions 20000 --warmup 2000 --l-target 240 \
            --out data/route_b/stage1_window_sweep.csv
      - name: Latency-target sweep
        run: |
          python scripts/route_b_experiment.py target-sweep \
            --trials 5 --transactions 20000 --warmup 2000 \
            --out data/route_b/stage1_target_sweep.csv
      - name: Gain sensitivity at provisional target 240 ms
        run: |
          python scripts/route_b_experiment.py gain-sensitivity \
            --trials 5 --transactions 20000 --warmup 2000 --l-target 240 \
            --out data/route_b/stage1_gain_sensitivity.csv
      - name: Summarize calibration
        run: |
          python scripts/route_b_summarize.py \
            --smoke data/route_b/stage1_smoke.csv \
            --window data/route_b/stage1_window_sweep.csv \
            --target data/route_b/stage1_target_sweep.csv \
            --gains data/route_b/stage1_gain_sensitivity.csv \
            --out data/route_b/STAGE1_SUMMARY.md
      - name: Upload calibration artifact
        uses: actions/upload-artifact@v4
        with:
          name: route-b-stage1
          path: data/route_b/
          if-no-files-found: error
